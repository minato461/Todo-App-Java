<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>タスク一覧</title>
	</head>
	<body>
		<h1>タスク一覧</h1>
		<table border="1">
			<tr>
				<th>ID</th>
				<th>タイトル</th>
				<th>内容</th>
				<th>登録者</th>
				<th>開始日</th>
				<th>終了日</th>
				<th>作成日時</th>
				<th>更新日時</th>
				<th>操作</th>
			</tr>
			<tr th:each="task : ${tasks}">
				<td th:text="${task.id}"></td>
				<td th:text="${task.username}"></td>
				<td th:text="${task.title}"></td>
				<td th:text="${task.content}"></td>
				<td th:text="${task.name}"></td>
				<td th:text="${task.startDate}"></td>
				<td th:text="${task.endDate}"></td>
				<td th:text="${task.createdAt}"></td>
				<td th:text="${task.updatedAt}"></td>
				<td>
					<button type="button">編集</button>
					<button type="button">削除</button>
				</td>
			</tr>
		</table>
		<a th:href="@{/tasks/new}">+ 新規作成</a>
	</body>
</html>
