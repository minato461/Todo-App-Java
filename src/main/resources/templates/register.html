<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<title>ユーザ登録</title>
	</head>
	<body>
		<h1>ユーザ登録</h1>
		<form th:action="@{/register}" method="post">
			ユーザ名（半角英数字）<br><input type="text" name="username" required><br>
			パスワード（半角英数字）<br><input type="password" name="password" required><br>
			<button type="submit">登録</button>
		</form>
		<br><a th:href="@{/login}">ログインはこちら</a>
	</body>
</html>
